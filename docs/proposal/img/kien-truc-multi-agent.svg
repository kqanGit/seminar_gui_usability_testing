<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Input -->
  <rect x="330" y="20" width="340" height="50" rx="25" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="500" y="52" text-anchor="middle" font-size="18">Nhóm: "Kiểm thử luồng Checkout"</text>
  <line x1="500" y1="70" x2="500" y2="99" stroke="#222" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Harness frame -->
  <rect x="30" y="100" width="940" height="330" rx="16" fill="#f5f5f5" stroke="#222" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="50" y="128" font-size="16" font-weight="bold" fill="#444">CLAUDE CODE (harness)</text>
  <text x="950" y="128" font-size="14" text-anchor="end" fill="#444">Hook: cấm sửa code EShop</text>

  <!-- QA Lead -->
  <rect x="340" y="140" width="320" height="76" rx="10" fill="#222" stroke="#222"/>
  <text x="500" y="172" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">QA Lead</text>
  <text x="500" y="199" text-anchor="middle" font-size="15" fill="#fff">lập kế hoạch · giao việc · gộp báo cáo</text>

  <!-- arrows to subagents -->
  <path d="M420,216 L180,262" stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M500,216 L500,262" stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M580,216 L820,262" stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

  <!-- Subagent 1 -->
  <rect x="55" y="265" width="270" height="145" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="190" y="295" text-anchor="middle" font-size="19" font-weight="bold">GUI Agent</text>
  <text x="190" y="320" text-anchor="middle" font-size="15" font-style="italic" fill="#444">Đúng đặc tả FR-21…24?</text>
  <text x="190" y="352" text-anchor="middle" font-size="14">gui-spec-check</text>
  <text x="190" y="374" text-anchor="middle" font-size="14">a11y-audit · visual-diff</text>
  <text x="190" y="398" text-anchor="middle" font-size="13" fill="#666">≈ Playwright + axe</text>

  <!-- Subagent 2 -->
  <rect x="365" y="265" width="270" height="145" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="500" y="295" text-anchor="middle" font-size="19" font-weight="bold">Heuristic Agent</text>
  <text x="500" y="320" text-anchor="middle" font-size="15" font-style="italic" fill="#444">Thiết kế có hợp lý?</text>
  <text x="500" y="352" text-anchor="middle" font-size="14">heuristic-review</text>
  <text x="500" y="374" text-anchor="middle" font-size="14">severity-rating (0–4)</text>
  <text x="500" y="398" text-anchor="middle" font-size="13" fill="#666">≈ chuyên gia UX</text>

  <!-- Subagent 3 -->
  <rect x="675" y="265" width="270" height="145" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="810" y="295" text-anchor="middle" font-size="19" font-weight="bold">User-sim Agent</text>
  <text x="810" y="320" text-anchor="middle" font-size="15" font-style="italic" fill="#444">Dùng có dễ không?</text>
  <text x="810" y="352" text-anchor="middle" font-size="14">usability-task-sim</text>
  <text x="810" y="374" text-anchor="middle" font-size="14">sus-seq-answer</text>
  <text x="810" y="398" text-anchor="middle" font-size="13" fill="#666">≈ người tham gia Maze</text>

  <!-- Tools -->
  <line x1="500" y1="430" x2="500" y2="462" stroke="#222" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="200" y="465" width="600" height="52" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="500" y="497" text-anchor="middle" font-size="17"><tspan font-weight="bold">Playwright MCP</tspan> · Terminal · File  →  <tspan font-weight="bold">EShop</tspan></text>

  <!-- Output -->
  <line x1="500" y1="517" x2="500" y2="549" stroke="#222" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="250" y="552" width="500" height="52" rx="26" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="500" y="584" text-anchor="middle" font-size="17"><tspan font-weight="bold">report.md</tspan>  →  Nhóm duyệt (human-in-the-loop)</text>
</svg>
