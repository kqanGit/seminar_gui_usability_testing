<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T1 GUI & Usability Testing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/github.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="reveal">
    <div class="slides" id="slides">
      <section class="title-slide">
        <p class="eyebrow">Software Testing · FIT@HCMUS · Nhóm 09</p>
        <h1>GUI &amp; Usability Testing</h1>
        <p class="subtitle">Playwright · Maze · AI Heuristic Reviewer — trên luồng Checkout của EShop</p>
        <p class="members">Nguyễn Đức Quang · Bửu Huỳnh Vĩnh Phúc · Bùi Minh Quân</p>
      </section>
      <!-- Các phần được nạp từ sections.json → sections/*.md -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script>
    (async () => {
      const container = document.getElementById('slides');
      try {
        const names = await (await fetch('sections.json')).json();
        for (const name of names) {
          const s = document.createElement('section');
          s.setAttribute('data-markdown', `sections/${name}.md`);
          s.setAttribute('data-separator', '^\\r?\\n---\\r?\\n$');
          s.setAttribute('data-separator-notes', '^Note:');
          container.appendChild(s);
        }
      } catch (e) {
        const s = document.createElement('section');
        s.innerHTML = '<h2>Không nạp được sections.json</h2><p>Hãy mở slide qua server: <code>npx serve -l 8080</code> ở thư mục gốc repo rồi mở <code>/slides/</code></p>';
        container.appendChild(s);
      }
      Reveal.initialize({
        hash: true,
        slideNumber: 'c/t',
        width: 1280,
        height: 720,
        margin: 0.04,
        transition: 'none',
        pdfSeparateFragments: false,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
      });
    })();
  </script>
</body>
</html>
